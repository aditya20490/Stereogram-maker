name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check icon exists
        run: |
          test -f icon.png || (echo "Upload icon.png to the repo root first" && exit 1)
          mkdir -p assets
          cp icon.png assets/icon.png

      - name: Install packages
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Allow camera permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Generate app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0f1a' --iconBackgroundColorDark '#0b0f1a'

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Stereo3D.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stereo 3D build ${{ github.run_number }}
          files: Stereo3D.apk
